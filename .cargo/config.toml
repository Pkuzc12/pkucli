# Faster links and a smaller target/ (see the [profile.*] tables in Cargo.toml).
# mold + clang are optional: without them, delete the target table below.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[alias]
# Drop dev/check artifacts (the bulk of target/), keep release binaries.
trim = "clean --profile dev"
